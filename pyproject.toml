[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mfa-tracker"
version = "0.1.0"
description = "Track MFA rollout progress over time and find where sign-ins bypass MFA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Edward Owusu"}]
keywords = ["mfa", "multi-factor authentication", "zero trust", "nist", "800-53", "phishing-resistant", "grc", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Intended Audience :: Information Technology",
]
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.37", "pandas>=2.0"]

[project.scripts]
mfa-tracker = "mfa_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mfa_tracker = ["data/*.json"]

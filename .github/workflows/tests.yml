name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run the tool on the sample data
        run: |
          PYTHONPATH=src python -m mfa_tracker samples/riverbend_mfa_snapshots.csv --signins samples/riverbend_signins.csv --out reports
          PYTHONPATH=src python -m mfa_tracker samples/northfield_mfa_snapshots.csv --signins samples/northfield_signins.csv --out reports --fail-on medium
